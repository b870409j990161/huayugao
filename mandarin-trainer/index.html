<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#255c4f" />
    <title>華語分級刷題</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">TOCFL Mandarin Trainer</p>
          <h1>華語分級刷題</h1>
        </div>
        <button class="icon-button" id="resetProgress" title="清除本機學習紀錄" aria-label="清除本機學習紀錄">↺</button>
      </header>

      <main>
        <section class="control-band" aria-label="學習設定">
          <label>
            等級
            <select id="levelSelect"></select>
          </label>
          <label>
            模式
            <select id="modeSelect">
              <option value="learn">學習</option>
              <option value="review">複習</option>
              <option value="practice">練習</option>
            </select>
          </label>
        </section>

        <section class="stats-grid" aria-label="學習記錄">
          <article>
            <span id="todayCount">0</span>
            <p>今日練習</p>
          </article>
          <article>
            <span id="masteredCount">0</span>
            <p>已掌握</p>
          </article>
          <article>
            <span id="accuracyCount">0%</span>
            <p>答題正確率</p>
          </article>
        </section>

        <nav class="tabs" aria-label="功能">
          <button class="active" data-view="grammar">語法練習</button>
          <button data-view="vocab">生詞庫</button>
          <button data-view="tocfl">模擬華測</button>
          <button data-view="records">學習記錄</button>
        </nav>

        <section class="workspace">
          <div class="panel-list" id="itemList" aria-label="教材列表"></div>
          <article class="study-card" id="studyCard" aria-live="polite"></article>
        </section>
      </main>
    </div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
